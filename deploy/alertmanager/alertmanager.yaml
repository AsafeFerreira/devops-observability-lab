global:
  resolve_timeout: 2m

route:
  receiver: local-evidence
  group_by: [alertname, service, category]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h
  routes:
    - receiver: local-evidence
      matchers:
        - severity=~"warning|critical"

receivers:
  - name: local-evidence
    webhook_configs:
      - url: http://alert-recorder:8090/alerts
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [service, category]
