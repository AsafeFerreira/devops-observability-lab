name: devops-observability-lab

x-app-environment: &app-environment
  DATABASE_URL: postgres://${POSTGRES_USER:-observability}:${POSTGRES_PASSWORD:-observability_dev}@postgres:5432/${POSTGRES_DB:-observability_lab}?sslmode=disable
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-observability}:${RABBITMQ_PASSWORD:-observability_dev}@rabbitmq:5672/
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  DEPLOYMENT_ENVIRONMENT: local
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-app-dependencies: &app-dependencies
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  otel-collector:
    condition: service_started

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-observability}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-observability_dev}
      POSTGRES_DB: ${POSTGRES_DB:-observability_lab}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-observability}:${POSTGRES_PASSWORD:-observability_dev}@postgres:5432/${POSTGRES_DB:-observability_lab}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.2.9-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-observability}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-observability_dev}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  imports-api:
    build:
      context: .
      args:
        SERVICE: api
    image: devops-observability-lab/imports-api:local
    environment:
      <<: *app-environment
      PORT: "8080"
      OUTBOX_INTERVAL: 500ms
    depends_on: *app-dependencies
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  imports-worker:
    build:
      context: .
      args:
        SERVICE: worker
    image: devops-observability-lab/imports-worker:local
    environment:
      <<: *app-environment
      PORT: "8081"
      INTEGRATION_URL: http://integration-simulator:8082
      PROCESSING_TIMEOUT: 3s
    depends_on:
      <<: *app-dependencies
      integration-simulator:
        condition: service_healthy
    ports:
      - "18081:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  integration-simulator:
    build:
      context: .
      args:
        SERVICE: integration-simulator
    image: devops-observability-lab/integration-simulator:local
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      DEPLOYMENT_ENVIRONMENT: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LAB_MODE: ${LAB_MODE:-true}
      PORT: "8082"
    depends_on:
      otel-collector:
        condition: service_started
    ports:
      - "18082:8082"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.5
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deploy/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.7
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./deploy/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./deploy/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./deploy/prometheus/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      alertmanager:
        condition: service_started
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.33.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yaml
      - --storage.path=/alertmanager
    volumes:
      - ./deploy/alertmanager/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    depends_on:
      alert-recorder:
        condition: service_healthy
    restart: unless-stopped

  alert-recorder:
    image: python:3.14.1-alpine3.23
    command: ["python", "/app/alert_recorder.py"]
    environment:
      PORT: "8090"
      ALERT_FILE: /data/alerts.ndjson
    volumes:
      - ./deploy/alert-recorder/alert_recorder.py:/app/alert_recorder.py:ro
      - alert-evidence:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-observability_dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    restart: unless-stopped

  k6:
    image: grafana/k6:2.1.0
    profiles: [tools]
    environment:
      BASE_URL: http://imports-api:8080
      LAB_K6_DURATION: ${LAB_K6_DURATION:-30s}
      LAB_K6_RATE: ${LAB_K6_RATE:-10}
    volumes:
      - ./tests/load:/scripts:ro
      - ./artifacts:/artifacts
    depends_on:
      imports-api:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
  prometheus-data:
  alertmanager-data:
  loki-data:
  tempo-data:
  grafana-data:
  alert-evidence:
