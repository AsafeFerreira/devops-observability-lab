name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-quality:
    name: Go quality and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal migrations)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Build services
        run: |
          go build ./cmd/api
          go build ./cmd/worker
          go build ./cmd/integration-simulator
      - name: Upload coverage
        uses: actions/upload-artifact@v5
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error

  configuration:
    name: Configuration as code
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Validate Grafana dashboard JSON
        run: jq empty deploy/grafana/dashboards/*.json
      - name: Validate Prometheus configuration and rules
        run: |
          docker run --rm \
            --volume "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:v3.13.2 \
            check config /etc/prometheus/prometheus.yaml
      - name: Validate Alertmanager configuration
        run: |
          docker run --rm \
            --volume "$PWD/deploy/alertmanager:/etc/alertmanager:ro" \
            --entrypoint amtool \
            prom/alertmanager:v0.33.1 \
            check-config /etc/alertmanager/alertmanager.yaml
      - name: Render Kubernetes manifests
        run: kubectl kustomize deploy/kubernetes/overlays/local > rendered-kubernetes.yaml
      - name: Validate Kubernetes schemas
        run: |
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -kubernetes-version 1.34.0 < rendered-kubernetes.yaml
      - name: Upload rendered Kubernetes manifests
        uses: actions/upload-artifact@v5
        with:
          name: rendered-kubernetes
          path: rendered-kubernetes.yaml
          if-no-files-found: error

  integration:
    name: Full-stack integration
    runs-on: ubuntu-24.04
    needs: [go-quality, configuration]
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Start complete stack
        run: |
          cp .env.example .env
          mkdir -p artifacts/backups
          docker compose up --build --detach --wait --wait-timeout 300
      - name: Smoke test
        run: ./scripts/smoke-test.sh
      - name: End-to-end scenarios
        run: ./scripts/integration-test.sh
      - name: Verify backup and restore
        run: ./scripts/verify-backup.sh
      - name: Save operational evidence
        if: always()
        run: |
          docker compose ps > artifacts/compose-ps.txt
          docker compose logs --no-color > artifacts/compose.log
          curl --silent http://localhost:9090/api/v1/alerts > artifacts/prometheus-alerts.json || true
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: integration-evidence
          path: artifacts/
          if-no-files-found: warn
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Scan repository dependencies and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
