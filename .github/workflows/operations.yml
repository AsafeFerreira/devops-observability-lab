name: Periodic Operations

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      load_rate:
        description: Requests per second for the short load test
        required: false
        default: "10"

permissions:
  contents: read

jobs:
  load-and-backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      K6_RATE: ${{ inputs.load_rate || '10' }}
      K6_DURATION: 30s
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Start stack
        run: |
          cp .env.example .env
          mkdir -p artifacts/backups
          docker compose up --build --detach --wait --wait-timeout 300
      - name: Run smoke and load tests
        run: |
          ./scripts/smoke-test.sh
          ./scripts/load-test.sh
      - name: Verify backup restoration
        run: ./scripts/verify-backup.sh
      - name: Capture monitoring state
        if: always()
        run: |
          curl --silent http://localhost:9090/api/v1/targets > artifacts/prometheus-targets.json || true
          curl --silent http://localhost:9090/api/v1/rules > artifacts/prometheus-rules.json || true
          docker compose logs --no-color > artifacts/compose.log
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: operations-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
